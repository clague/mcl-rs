[package]
name = "mcl-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
dirs = "5"
tokio-stream = "0.1"
futures = "0.3"
sha1 = "0.10"
urlencoding = "2"
open = "5"
zip = "0.6"
